version: '3.8'
services:
  order-service:
    build: ./order-service
    ports:
      - "8081:8081"

  inventory-service:
    build: ./inventory-service
    ports:
      - "8082:8082"

  analytics-service:
    build: ./analytics-service
    ports:
      - "8083:8083"

  auth-service:
    build: ./auth-service
    ports:
      - "8084:8084"

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"

  kafka:
    image: bitnami/kafka:latest
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper

  zookeeper:
    image: bitnami/zookeeper:latest
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
